
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security Alert</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #000;
  color: #00ff41;
  font-family: monospace;
  overflow: hidden;
}

#screen {
  position: fixed;
  inset: 0;
  background: #000;
  padding: 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow: hidden;
}

h1 {
  color: red;
  font-size: 27px;
  text-shadow: 0 0 15px red;
  animation: blink 0.8s infinite;
}

@keyframes blink {
  50% { opacity: .4; }
}

#timer {
  font-size: 75px;
  color: #00ff41;
  text-shadow: 0 0 20px #00ff41;
  margin: 12px;
}

#logs {
  width: 100%;
  height: 150px;
  overflow: hidden;
  color: #00ff41;
  font-size: 13px;
  line-height: 2;
  text-align: left;
  direction: ltr;
}

.red { color: #ff2222; }

#finish {
  display: none;
  color: white;
  font-family: Tahoma, sans-serif;
  font-size: 25px;
}

#exit {
  position: absolute;
  bottom: 14px;
  background: #333;
  color: white;
  border: 1px solid white;
  padding: 8px 14px;
  border-radius: 8px;
}
</style>
</head>

<body>

<div id="screen">
  <h1>⚠️ تلفون شما هک شد!</h1>
  Sana Jan

  <p class="red">SECURITY BREACH DETECTED</p>

  <div id="logs"></div>

  <div id="timer">۵۹</div>

  <div id="finish">
    خطر!<br><br>
تلیفون از بین رفت </div>

  <script>
let seconds = ۵۹;
let timerInterval;
let logInterval;

const messages = [
  "SYSTEM SCANNING...",
  "WARNING: SIMULATED ALERT",
  "CHECKING SECURITY...",
  "ACCESS SIMULATION STARTED",
  "ENCRYPTION TEST...",
  "SECURITY STATUS: DEMO",
  "RUNNING FAKE DIAGNOSTICS...",
  "WARNING: PRANK IN PROGRESS"
];

function addLog() {
  const logs = document.getElementById("logs");
  const line = document.createElement("div");

  line.textContent =
    "> " + messages[Math.floor(Math.random() * messages.length)];

  if (Math.random() > 0.5) {
    line.className = "red";
  }

  logs.appendChild(line);

  while (logs.children.length > 6) {
    logs.removeChild(logs.firstChild);
  }
}

function startPrank() {
  addLog();

  logInterval = setInterval(addLog, 700);

  timerInterval = setInterval(() => {
    seconds--;

    document.getElementById("timer").textContent = seconds;

    if (seconds <= 0) {
      clearInterval(timerInterval);
      clearInterval(logInterval);

      document.getElementById("timer").style.display = "none";
      document.getElementById("logs").style.display = "none";
      document.querySelector("h1").style.display = "none";
      document.querySelector("p").style.display = "none";

      document.getElementById("finish").style.display = "block";
    }
  }, 1000);
}

function endPrank() {
  clearInterval(timerInterval);
  clearInterval(logInterval);
  document.getElementById("screen").innerHTML =
    "<h2 style='color:#00ff41'> 

window.addEventListener("load", startPrank);
</script>

</body>
</html>
